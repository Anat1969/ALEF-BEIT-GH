name: Build app for raw.githack

# Builds the app with relative paths into build/ and commits it, so the latest
# merge is viewable at raw.githack without spending a Vercel deployment.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'build/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      - name: Build
        working-directory: ./app
        run: npm run build:github

      - name: Commit build/ if it changed
        run: |
          git add -A build
          if git diff --cached --quiet; then
            echo "build/ unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build app for raw.githack"
          git push
